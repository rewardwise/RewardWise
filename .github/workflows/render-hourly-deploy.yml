name: Render Keep-Warm Ping

# Was "Hourly Render Deploy": curl'd the Render DEPLOY HOOK on a */5 cron,
# forcing a full rebuild + instance swap of an UNCHANGED commit over and over.
# Each swap severed in-flight requests — root cause of the 2026-07-26
# "Service temporarily unavailable" mid-conversation failure (the backend's
# reply was logged in Supabase but never reached the browser). Real deploys
# happen on push to main via Render's native auto-deploy; this workflow now
# only keeps the free-tier instance warm with a plain health GET (no swap).
# The RENDER_DEPLOY_HOOK_URL secret is intentionally no longer used.

on:
  schedule:
    - cron: "*/10 * * * *" # keep-warm cadence; free tier idles out at ~15m
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Health ping (keep-warm, no instance swap)
        # GitHub throttles this cron to ~hourly in practice, so the free-tier
        # instance often idles out between pings. Hitting a COLD instance is
        # this job doing its job — allow the full cold-start (~60s) and retry
        # so it doesn't false-fail and email the operator (2026-07-26).
        run: curl -fsS --max-time 90 --retry 2 --retry-all-errors --retry-delay 10 "https://mytravelwalletai-backend.onrender.com/api/health"
